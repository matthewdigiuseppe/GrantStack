## GrantStack per-proposal config.
## Edit at the start of a proposal; revisit after major decisions.

grant:
  scheme: ""               # erc-stg | erc-cog | erc-adg | nwo-veni | nwo-vidi | nwo-vici | other
  acronym: ""              # the memorable project acronym (grants live on these)
  title: ""                # full project title
  short_name: ""           # for filenames; e.g. "group-formation"
  call_deadline: ""        # YYYY-MM-DD
  host_institution: ""     # the host that signs and administers the grant
  format: "latex"          # "latex" | "markdown"
  status: "framing"        # framing | positioning | designing | writing | review | submitted | rebuttal | interview | funded | rejected | resubmitting

pi:
  name: ""                 # the applicant / principal investigator
  phd_year: ""             # YYYY — eligibility windows are per scheme and per call; verify against the call
  eligibility_notes: ""    # extensions (parental leave, etc.), prior ERC/NWO grants, host endorsement

budget:
  amount: ""               # e.g. 2000000
  currency: "EUR"
  duration_months: ""      # e.g. 60

project:
  one_sentence_breakthrough: ""   # THE ground-breaking claim, no clauses
  objectives: []                  # 3-4 high-level objectives; /grantstack:objectives populates this

panel:
  # The review panel /grantstack:panel-convene simulates. Composed once from the
  # funder's published roster and reused, so a later run shows whether a revision
  # moved anyone. The composed personas live in .grantstack/panel-roster.md.
  code: ""                 # ERC panel (SH2, PE6, LS4...), an NWO committee, or a description
  size: 8                  # 4-8 reviewers
  dogmatism: 5             # 0-10 centre; the panel spreads around it, per-persona
  grounding: "archetype"   # archetype | named  — named infers from real members' published work

decisions:
  # The proposal's decision log — the one place non-obvious calls are recorded.
  # Append a one-liner every time you make one; /grantstack:retro reads them back.
  # - "2026-05-09: dropped the fieldwork WP; too high-risk for the timeline panel will accept."

voice:
  # Name of a Claude Code skill that defines your prose voice (tone, rhythm,
  # vocabulary). GrantStack does not ship one — install or author your own and
  # put its skill name here. Leave empty to use a generic scholarly-but-vivid
  # grant voice.
  writing_style: ""
  # Name of a reviewer-style skill for /grantstack:panel-mock. Leave empty to
  # use GrantStack's built-in fallback (references/panel-report-conventions.md).
  reviewer_style: ""
